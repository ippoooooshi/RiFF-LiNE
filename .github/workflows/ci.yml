name: CI

# 15_development_process.md §2 / §3.1: PR ごとに品質ゲートを回し、緑でなければ main へマージできないようにする。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # .claude/rules/quality.rule.md §2 機械的ゲート。設計書のリンク切れ（F2）・
      # UI のダミー配線（F3）・テスト ID の欠落（F10）は、いずれも人手の監査でしか
      # 見つからなかったため機械化した（.claude/docs/quality.md）。
      - name: Quality checks (docs links / stub wiring / test ids)
        run: pnpm run check:quality

      - name: Lint (レイヤー依存規則を含む)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit / Integration tests
        run: pnpm test

      - name: Build
        run: pnpm build
      # <!-- req webcorefoundation:4cf8aab7.4184 -->

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate PR commit messages
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
