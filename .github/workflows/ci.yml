name: CI

# 15_development_process.md §2 / §3.1: PR ごとに品質ゲートを回し、緑でなければ main へマージできないようにする。 <!-- req webcorefoundation:fe3c229d.42c8 --> <!-- req webcorefoundation:fe3c229d.53de --> <!-- req webcorefoundation:fe3c229d.21b0 --> <!-- req webcorefoundation:fe3c229d.47d0 --> <!-- req webcorefoundation:a1472f24.484c -->
on:
  pull_request:
    branches: [main]
  # web-core-foundation.md 2.2 節「PR と push ごとに pnpm lint を走らせる」。push はブランチを問わない
  push:
    branches: ['**']

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # Node.js の版は .nvmrc の 1 つで固定する（web-core-foundation.md 15.3 節） <!-- req webcorefoundation:56e701f0.e540 --> <!-- req webcorefoundation:56e701f0.e838 --> <!-- req webcorefoundation:56e701f0.f17b -->
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # .claude/rules/quality.rule.md §2 機械的ゲート。設計書のリンク切れ（F2）・
      # UI のダミー配線（F3）・テスト ID の欠落（F10）は、いずれも人手の監査でしか
      # 見つからなかったため機械化した（.claude/docs/quality.md）。 <!-- req webcorefoundation:59dd26df.e1a7 --> <!-- req webcorefoundation:59dd26df.e8eb --> <!-- req webcorefoundation:59dd26df.1c06 --> <!-- req webcorefoundation:59dd26df.edb1 --> <!-- req webcorefoundation:06b04081.345e --> <!-- req webcorefoundation:06b04081.8527 --> <!-- req webcorefoundation:06b04081.5f67 --> <!-- req webcorefoundation:c33afead.24d2 -->
      - name: Quality checks (docs links / stub wiring / test ids) # <!-- req webcorefoundation:5aed688a.04c8 -->
        run: pnpm run check:quality

      # <!-- req webcorefoundation:470660c5.8930 --> <!-- req webcorefoundation:470660c5.dcc1 --> <!-- req webcorefoundation:0cbb8d74.fb55 --> <!-- req webcorefoundation:fd8feedc.ecdb --> <!-- req webcorefoundation:4efe2ae6.902b --> <!-- req webcorefoundation:4efe2ae6.2f43 -->
      - name: Lint (レイヤー依存規則を含む)
        run: pnpm lint

      # 14.7 節：型チェックは pnpm typecheck（tsc -b） <!-- req webcorefoundation:a124df45.8dc3 --> <!-- req webcorefoundation:a124df45.9d1a --> <!-- req webcorefoundation:49a98d6e.5a1d -->
      # 出力のファイルは dist/ に作り（.gitignore）、型の検査は tsc --noEmit と同じ。CI は毎回まっさらな所から作るので古い出力で通らない（2026-10-24 本人決定） <!-- req webcorefoundation:7de6011d.8dc3 --> <!-- req webcorefoundation:7de6011d.af38 --> <!-- req webcorefoundation:7de6011d.3390 --> <!-- req webcorefoundation:7de6011d.00c4 -->
      - name: Typecheck
        run: pnpm typecheck

      # web-core-foundation.md 14.7 節：書式の確かめは Prettier の --check <!-- req webcorefoundation:56513857.efa2 --> <!-- req webcorefoundation:56513857.e3f6 --> <!-- req webcorefoundation:b7dbce30.94b0 -->
      - name: Format check
        run: pnpm format

      # 14.7 節：単体テストと結合テストをカバレッジの計測つきで走らせる（vitest run --coverage）。
      # 14.7 節：カバレッジの計測としきい値（package.json の test:coverage）と、上の書式の確かめを入れた <!-- req webcorefoundation:52d9b484.bc26 --> <!-- req webcorefoundation:52d9b484.82f4 --> <!-- req webcorefoundation:52d9b484.efbc -->
      # しきい値（C0・C1 の 100%）は vitest.config.ts の coverage.thresholds で、下回るとこの段が失敗する <!-- req webcorefoundation:918ed38a.6f28 --> <!-- req webcorefoundation:c40ead5a.8585 --> <!-- req webcorefoundation:7591d2cf.9c5e --> <!-- req webcorefoundation:b7dbce30.bc26 --> <!-- req webcorefoundation:b7dbce30.a0ff -->
      - name: Unit / Integration tests (coverage)
        run: pnpm test:coverage
      # 15.7 節の基準 3 と 6：カバレッジの基準を満たしてテストが通ることの確かめの手段はこの CI で、CI が通る状態を保つ <!-- req webcorefoundation:0b1dbf55.c702 --> <!-- req webcorefoundation:60b4bb22.45a0 -->

      # 15.7 節の基準 6：アプリを組み立てられる状態を保つ（起動して動くことは基準 5 の手で確かめるシナリオで見る） <!-- req webcorefoundation:60b4bb22.ea78 -->
      - name: Build
        run: pnpm build
      # <!-- req webcorefoundation:4cf8aab7.4184 --> <!-- req webcorefoundation:59dd26df.445b -->

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 14.7 節：PR のコミットの commitlint を走らせる <!-- req webcorefoundation:59dd26df.ebfd -->
      - name: Validate PR commit messages
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

# web-core-foundation.md 15.3 節：CI は GitHub Actions（公開と無料の枠）で、PR を作るたびと更新するたびに Lint・型チェック・書式の確かめ・単体テストを走らせる。書式の確かめとカバレッジのしきい値（基本設計 11 章 0 節の目標値）は、14.7 節の G75 で足す。 <!-- req webcorefoundation:b1460db9.1649 -->
# CI でのビルドとテストは緩めず、費用のかからない自動の工程は当てる範囲を広げる。ビルドしたものを配る自動化は入れず、品質のゲートの最小限に留める。ブランチの保護のルールでこのステータスのチェックを必須にし、失敗している間は main へマージさせない（GitHub の設定で本人が行う）。 <!-- req webcorefoundation:5477703a.e656 --> <!-- req webcorefoundation:5477703a.e5de --> <!-- req webcorefoundation:5477703a.f177 --> <!-- req webcorefoundation:5477703a.4760 --> <!-- req webcorefoundation:5477703a.7b4e --> <!-- req webcorefoundation:5477703a.54dd --> <!-- req webcorefoundation:5477703a.cdcc --> <!-- req webcorefoundation:5477703a.e674 --> <!-- req webcorefoundation:5477703a.84f9 --> <!-- req webcorefoundation:5477703a.358e --> <!-- req webcorefoundation:5477703a.74d7 --> <!-- req webcorefoundation:5477703a.4a6e --> <!-- req webcorefoundation:27b6f645.c6d2 --> <!-- req webcorefoundation:a5d2c742.2e63 --> <!-- req webcorefoundation:a5d2c742.f798 --> <!-- req webcorefoundation:a5d2c742.79c4 --> <!-- req webcorefoundation:fe9d9589.62f6 --> <!-- req webcorefoundation:fe9d9589.875e --> <!-- req webcorefoundation:fe9d9589.20b7 -->
# 依存ライブラリの脆弱性は定期のスキャンをせず、pnpm audit と Dependabot の自動のスキャンを CI に組み込まない。問題が分かったとき（アップデートのときの警告・公開された情報）に、その都度依存を更新する。 <!-- req webcorefoundation:703d6ee6.f555 --> <!-- req webcorefoundation:703d6ee6.337e --> <!-- req webcorefoundation:703d6ee6.2681 --> <!-- req webcorefoundation:703d6ee6.7590 --> <!-- req webcorefoundation:703d6ee6.bbdf --> <!-- req webcorefoundation:703d6ee6.75e8 --> <!-- req webcorefoundation:703d6ee6.fadf -->
# ブランチの運用（GitHub で本人が行う。このファイルの設定では満たさない）：作業パッケージごとに feature/<スラッグ> のブランチを切り、main へ直接コミットしない。XL はサブ機能ごとに分けてよい。実験は spike/ のブランチで扱い、main にマージしない。main はいつもビルドと起動ができる状態に保ち、PR を作ってステータスのチェックが通ってから Squash merge でまとめ、feature のブランチを消す。 <!-- req webcorefoundation:57197f87.1ebd --> <!-- req webcorefoundation:57197f87.a64e --> <!-- req webcorefoundation:57197f87.ded0 --> <!-- req webcorefoundation:bf4a8e35.5472 --> <!-- req webcorefoundation:bf4a8e35.b246 --> <!-- req webcorefoundation:bf4a8e35.fb37 --> <!-- req webcorefoundation:bf4a8e35.9b40 --> <!-- req webcorefoundation:506ebed7.863d --> <!-- req webcorefoundation:506ebed7.428d --> <!-- req webcorefoundation:506ebed7.6d2d --> <!-- req webcorefoundation:a68e2106.015b --> <!-- req webcorefoundation:a68e2106.412a --> <!-- req webcorefoundation:a68e2106.e8fa --> <!-- req webcorefoundation:4413e6c2.4b0a --> <!-- req webcorefoundation:4413e6c2.a16b --> <!-- req webcorefoundation:4413e6c2.a15c --> <!-- req webcorefoundation:4413e6c2.09c6 --> <!-- req webcorefoundation:4413e6c2.7a86 -->
# 15.1 節（本人と Claude Code の作業の決まり。このファイルの設定では満たさない）：厳密さは誰の時間で測るかで決める。「隙間の時間」の制約が効くのは本人の時間を使う工程（全部の差分を読むレビュー・手で書くテスト）だけ。レビューは Claude Code のセルフレビューに任せ、テストは Claude Code が実装の後に足す。 <!-- req webcorefoundation:a5d2c742.9dca --> <!-- req webcorefoundation:a5d2c742.30f1 --> <!-- req webcorefoundation:a5d2c742.3145 --> <!-- req webcorefoundation:5d51dbba.ba1b --> <!-- req webcorefoundation:5d51dbba.8ae8 --> <!-- req webcorefoundation:42c419e0.a58d --> <!-- req webcorefoundation:42c419e0.32c6 --> <!-- req webcorefoundation:42c419e0.2538 -->
# 15.1 節：自動の工程を緩めない決まりの外に置くのは、テストの後書き（TDD を採らない。L と XL はサブ機能の区切りごとに足す）と、小粒の作業での順の崩しの 2 つだけ。順を崩してもセルフレビューと完了の基準は省かない。作業パッケージの実施の順は基本設計 15 章 4 節（15.4 節）。 <!-- req webcorefoundation:4f44f5b8.3c59 --> <!-- req webcorefoundation:4f44f5b8.d8d3 --> <!-- req webcorefoundation:4f44f5b8.b12f --> <!-- req webcorefoundation:4f44f5b8.d418 --> <!-- req webcorefoundation:4f44f5b8.4481 --> <!-- req webcorefoundation:4f44f5b8.b760 --> <!-- req webcorefoundation:d23987ed.9326 -->
# 15.1 節：品質を最優先にし、目標値を数値で、機械かチェックリストで判定できる形にして運用する。判断の理由を文書に残す 5 つの運用は、サイズや儀式を理由に省かない。セルフレビューは会話の履歴を共有しない別のセッションに、PR の差分と関連する設計書だけを読ませる。 <!-- req webcorefoundation:49e62971.9774 --> <!-- req webcorefoundation:49e62971.249f --> <!-- req webcorefoundation:49e62971.85bc --> <!-- req webcorefoundation:49e62971.312a --> <!-- req webcorefoundation:49e62971.8f38 --> <!-- req webcorefoundation:0075f831.6f04 --> <!-- req webcorefoundation:0075f831.3e4e --> <!-- req webcorefoundation:0075f831.d8c9 --> <!-- req webcorefoundation:0075f831.e34e --> <!-- req webcorefoundation:3473f992.ad82 --> <!-- req webcorefoundation:3473f992.e74f --> <!-- req webcorefoundation:3473f992.d4d2 -->
# 15.2 節：V 字モデルに沿い、要件定義は運用テスト、基本設計はシステムテスト、詳細設計は結合テスト、実装（ソースコード）は単体テストで確かめる。単体テストはメソッドごとに C0 と C1、重要なロジックは C2 も満たす（しきい値は 14.3 節と 14.7 節の G75）。 <!-- req webcorefoundation:1e14e48f.6b80 --> <!-- req webcorefoundation:1e14e48f.6754 --> <!-- req webcorefoundation:faae14c6.8be8 --> <!-- req webcorefoundation:8677b563.d2ce --> <!-- req webcorefoundation:2f48467a.e1f4 --> <!-- req webcorefoundation:e25b43c9.6e63 --> <!-- req webcorefoundation:e25b43c9.724e --> <!-- req webcorefoundation:e25b43c9.f1ea --> <!-- req webcorefoundation:e25b43c9.56f4 -->
# 14.1 節：自動で測れるものは PR ごとに機械で確かめる。quality-gate で pnpm lint と pnpm typecheck、commitlint の job で PR のコミットを確かめる。14.2 節：単体テストと結合テストは pnpm test の 1 つの段で回す <!-- req webcorefoundation:49a98d6e.4426 --> <!-- req webcorefoundation:49a98d6e.a85a --> <!-- req webcorefoundation:6774d8b3.0ec7 --> <!-- req webcorefoundation:7591d2cf.370d --> <!-- req webcorefoundation:7591d2cf.b742 --> <!-- req webcorefoundation:7591d2cf.2d8f --> <!-- req webcorefoundation:64f10aef.2943 -->
# 14.7 節：負荷テスト（14.8 節）はこの CI で自動にしない（Phase 0 から Phase 1 に着手した後に実機で手で行う）。今は範囲の外 <!-- req webcorefoundation:c18d957b.d451 --> <!-- req webcorefoundation:c18d957b.d35d -->
